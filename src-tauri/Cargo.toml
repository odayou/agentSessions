[package]
name = "agentsessions"
version = "0.1.0"
description = "跨 AI 编码平台的统一会话管理工具"
edition = "2021"

# 打包无法在 Windows 交叉，仅本机
[lib]
name = "agentsessions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools 特性：release 打包版也允许打开 WebView 开发者工具（F12 调试前端）
tauri = { version = "2", features = ["devtools"] }
# 系统目录/文件选择对话框（设置页 Agent 会话目录「浏览…」用）
tauri-plugin-dialog = "2"
# 系统默认浏览器打开外链（webview 内 window.open / target=_blank 被拦截，检查更新与 markdown 链接用）
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[build]
rustflags = ["-A", "dead_code", "-A", "unused_variables", "-A", "unused_imports"]
