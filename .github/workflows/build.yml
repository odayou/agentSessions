name: Build AgentSessions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0) — only use if tag push did not trigger'
        required: false

env:
  # 覆盖 src-tauri/rust-toolchain.toml（其固定 stable-x86_64-pc-windows-msvc，
  # 该通道在 mac/linux runner 上不可用；windows-latest 下 stable 即 MSVC 主机工具链）
  RUSTUP_TOOLCHAIN: stable

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version from tag or input
        id: resolve
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            echo "ERROR: No version tag found. Push a tag (e.g., v0.2.0) or provide version input."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved: tag=$TAG version=$VERSION"

  create-release:
    name: Create Draft Release
    needs: resolve-version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        with:
          script: |
            const tagName = process.env.TAG;
            let releaseId;

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              core.info(`Release already exists for tag ${tagName}, id=${existing.id}`);
              if (existing.draft) {
                core.info('Existing release is draft, reusing it');
                releaseId = existing.id;
              } else {
                core.warning(`Release for tag ${tagName} already published (id=${existing.id}), reusing it`);
                releaseId = existing.id;
              }
            } catch (err) {
              if (err.status === 404) {
                core.info(`Creating new draft release for tag ${tagName}`);
                const { data } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  name: `AgentSessions ${tagName}`,
                  body: `**Version:** ${tagName}`,
                  draft: true,
                  prerelease: false
                });
                releaseId = data.id;
              } else {
                throw err;
              }
            }

            core.setOutput('id', releaseId);

  build:
    name: Build ${{ matrix.platform.name }}
    needs: [resolve-version, create-release]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis,msi
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # CodeBuddy 云端组件按需下载的分发件：与安装包同版本发布，客户端设置页按需拉取
      # （optional 原生依赖 npm install 时按平台过滤，故须在各平台 runner 上分别构建）
      - name: Build CodeBuddy CLI package
        run: node scripts/build-cli-pkg.js --out dist-cli

      # 直接用 create-release 的 release_id 上传，避免按 tag 解析 draft release
      # （releases/tags/<tag> 对 draft 恒 404，gh 只能靠 GraphQL 兜底，跨平台不稳定）
      - name: Upload CLI package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        shell: bash
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release_id 为空（create-release 未产出 id），无法确定上传目标"
            exit 1
          fi
          # 资产上传端点只在 uploads.github.com，取 release 自带的 upload_url 并去掉 {?name,label}
          upload_url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -q .upload_url | cut -d'{' -f1)
          shopt -s nullglob
          files=(dist-cli/codebuddy-cli-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::dist-cli 下没有任何 codebuddy-cli-* 产物，跳过后会导致客户端无法按需下载 CLI"
            echo "dist-cli 当前内容："
            ls -la dist-cli 2>/dev/null || echo "(dist-cli 目录不存在)"
            exit 1
          fi
          echo "待上传产物："
          printf '  %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            name=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --paginate \
                    -q ".[] | select(.name==\"$name\") | .id" || true)
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "$upload_url?name=$name"
          done

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install system dependencies (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # 用 tag 版本覆盖 tauri.conf.json 里的静态 version，产物文件名随 tag 走
      - name: Write version override
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: printf '{"version":"%s"}\n' "$VERSION" > src-tauri/tauri.conf.ci.json
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundle }} --config src-tauri/tauri.conf.ci.json'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn

  publish-release:
    name: Publish Release
    needs: [resolve-version, create-release, build]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result != 'cancelled' }}
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Publish Release
        id: check
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const buildResult = '${{ needs.build.result }}';

            if (buildResult === 'failure') {
              core.info('Build failed, keeping release as draft');
              core.setOutput('published', 'false');
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });
            core.info('Release published successfully');
            core.setOutput('published', 'true');
